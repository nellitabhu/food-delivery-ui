<!DOCTYPE html>
<html lang="en">
<head>
<title>Food Delivery App</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="header">
    <h1>TheKitchen</h1>

    <input type="text"
           placeholder="Search your favorite food..."
           class="search">
</div>

<h2>Top Categories</h2>

<div class="categories">
    <div class="cat">🍛 Biryani</div>
    <div class="cat">🍔 Burger</div>
    <div class="cat">🍩 Donut</div>
    <div class="cat">🍦 Ice Cream</div>
    <div class="cat">🍕 Pizza</div>
</div>

<h2>Recommended For You</h2>

<div class="foods">

    <div class="card">
        <img src="images/biryani.jpg" alt="Biryani">
        <h3>Biryani</h3>
        <p>₹250</p>
        <a href="details.html">
            <button>View Details</button>
        </a>
    </div>

    <div class="card">
        <img src="images/burger.jpg" alt="Burger">
        <h3>Burger</h3>
        <p>₹150</p>
        <a href="details.html">
            <button>View Details</button>
        </a>
    </div>

    <div class="card">
        <img src="images/dount.jpg" alt="Dount">
        <h3>Dount</h3>
        <p>₹120</p>
        <a href="details.html">
            <button>View Details</button>
        </a>
    </div>

    <div class="card">
        <img src="images/icecream.jpg" alt="Ice Cream">
        <h3>Ice Cream</h3>
        <p>₹100</p>
        <a href="details.html">
            <button>View Details</button>
        </a>
    </div>

    <div class="card">
        <img src="images/pizza.jpg" alt="Pizza">
        <h3>Pizza</h3>
        <p>₹300</p>
        <a href="details.html">
            <button>View Details</button>
        </a>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
